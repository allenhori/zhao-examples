name: zhao-lineage

on:
  pull_request:
    paths:
      - "dbt_projects/breaking-change-gate/**"
      - ".github/workflows/zhao-lineage.yml"

defaults:
  run:
    working-directory: dbt_projects/breaking-change-gate

jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-core and dbt-duckdb
        run: pip install dbt-core dbt-duckdb

      - name: Install zhao-cli
        run: curl -fsSL https://raw.githubusercontent.com/allenhori/zhao-cli/master/scripts/install.sh | sh

      - name: dbt seed
        run: dbt seed
        env:
          DBT_PROFILES_DIR: .

      - name: dbt compile (target/manifest.json is all zhao lineage reads)
        run: dbt compile
        env:
          DBT_PROFILES_DIR: .

      # Plain text: a structural upstream/downstream query, no Baseline, no
      # git, no diff -- answers "what's connected to this model right now?"
      - name: Run zhao lineage (plain text, dim_customers)
        run: PATH="$HOME/.zhao/bin:$PATH" zhao lineage dim_customers --text

      # HTML is zhao lineage's actual default output mode (--text opts out
      # of it, not the other way around). No committed-report/diff-gate
      # here: lineage is a live structural query, not a Baseline diff --
      # there's no real "stale" state to catch, and no real team fails a PR
      # because a generated graph view's bytes changed. Regenerate it fresh
      # and upload it so a reviewer can open it from the Actions run and see
      # the blast radius before approving -- that's the realistic use case.
      - name: Run zhao lineage (HTML, dim_customers)
        run: PATH="$HOME/.zhao/bin:$PATH" zhao lineage --html target/lineage_report_dim_customers.html dim_customers

      - name: Upload the report as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhao-lineage-dim-customers-report
          path: dbt_projects/breaking-change-gate/target/lineage_report_dim_customers.html
