name: breaking-change-gate

on:
  pull_request:
    paths:
      - "dbt_projects/breaking-change-gate/**"
      - ".github/workflows/breaking-change-gate.yml"

defaults:
  run:
    working-directory: dbt_projects/breaking-change-gate

jobs:
  zhao-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # zhao's baseline resolution needs full history to find the merge-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-core and dbt-duckdb
        run: pip install dbt-core dbt-duckdb

      - name: Install zhao-cli
        run: curl -fsSL https://raw.githubusercontent.com/allenhori/zhao-cli/master/scripts/install.sh | sh

      - name: dbt seed
        run: dbt seed
        env:
          DBT_PROFILES_DIR: .

      - name: dbt compile (current state)
        run: dbt compile
        env:
          DBT_PROFILES_DIR: .

      # `id` set explicitly so later steps can gate on *this specific step's*
      # outcome, not just GitHub Actions' default "did anything before me
      # fail" behavior -- see the `if:` conditions below. This is the actual
      # gate: nothing that touches a real schema runs unless this passes.
      - name: Run zhao check (breaking-change gate)
        id: zhao_check
        run: PATH="$HOME/.zhao/bin:$PATH" zhao check --against "origin/${{ github.base_ref }}"
        env:
          DBT_PROFILES_DIR: .

      # Same engine as the check step above -- identical Baseline resolution,
      # diff, Rule evaluation, and report -- but `zhao diff` always exits zero,
      # so it's the dev-time "just show me what changed" command, not a gate.
      # `if: always()` deliberately runs this even when the check step above
      # just failed the job, to make the exit-code contrast visible in the
      # same log: same report either way, only the exit code differs. This is
      # purely informational -- it never drives the build below.
      - name: Run zhao diff (dev-time inspection -- same report, always exits 0)
        if: always()
        run: |
          PATH="$HOME/.zhao/bin:$PATH" zhao diff --against "origin/${{ github.base_ref }}"
          echo "zhao diff exit code: $?"
        env:
          DBT_PROFILES_DIR: .

      # Explicitly gated on `zhao check` (the gate step above) having
      # succeeded -- `if: steps.zhao_check.outcome == 'success'`, spelled out
      # rather than relying on GitHub Actions' implicit "skip on any earlier
      # failure" default, so the gate is visible in the workflow file and in
      # the Actions UI, not just an emergent side effect of step ordering. If
      # `zhao check` failed (a real breaking change), this step and every
      # step after it show as skipped, not run-and-ignored -- nothing below
      # touches a database at all once a breaking change is detected.
      - name: Read zhao diff's JSON output -> compute the actually-impacted model list
        if: steps.zhao_check.outcome == 'success'
        run: |
          PATH="$HOME/.zhao/bin:$PATH" zhao diff --against "origin/${{ github.base_ref }}" --format json > /tmp/zhao_diff.json
          jq -r '((.changes // [])[].node | split(".") | last), ((.impacted_models // [])[])' /tmp/zhao_diff.json \
            | sort -u > /tmp/impacted_models.txt
          echo "zhao's changed-or-impacted model list for this PR:"
          cat /tmp/impacted_models.txt
        env:
          DBT_PROFILES_DIR: .

      # `staging` is a separate dbt target (see profiles.yml), same database
      # but its own schema -- seeding it here loads the raw source data that
      # schema needs to build against. This is the prerequisite data, not
      # what's being validated; the next step is what actually builds the
      # models under test.
      - name: dbt seed --target staging (prerequisite source data for the staging schema)
        if: steps.zhao_check.outcome == 'success'
        run: dbt seed --target staging
        env:
          DBT_PROFILES_DIR: .

      # Same explicit gate as above. Builds into the `staging` target/schema
      # specifically (see profiles.yml) -- a PR's validation build lands in
      # its own isolated schema, never the schema `dev` seeds/compiles
      # against, mirroring how a real team validates a PR without touching
      # anything "production" means for them.
      - name: Read zhao diff's JSON output -> build only the actually-impacted models (staging schema)
        if: steps.zhao_check.outcome == 'success'
        run: |
          if [ -s /tmp/impacted_models.txt ]; then
            SELECT=$(paste -sd ' ' /tmp/impacted_models.txt)
            echo "Running: dbt build --target staging --select $SELECT"
            dbt build --target staging --select $SELECT
          else
            echo "zhao reports no changed or impacted models for this PR -- nothing to build."
          fi
        env:
          DBT_PROFILES_DIR: .

      # Real proof, not a claim: query the staging schema itself and confirm
      # exactly the impacted-model list computed above -- and nothing else --
      # actually landed there as a model (the seeds are also in this schema,
      # since the build needs them, but they're prerequisite source data,
      # not something zhao flagged as impacted, so they're reported
      # separately here rather than conflated with the actual result). Same
      # explicit gate -- if zhao_check failed, this is skipped too.
      - name: Confirm what actually landed in the staging schema
        if: steps.zhao_check.outcome == 'success'
        run: |
          python3 -c "
          import duckdb
          con = duckdb.connect('breaking_change_gate.duckdb')
          rows = con.sql(\"select table_name from information_schema.tables where table_schema = 'staging' order by 1\").fetchall()
          all_tables = {name for (name,) in rows}
          impacted = set(open('/tmp/impacted_models.txt').read().split()) if __import__('os').path.exists('/tmp/impacted_models.txt') else set()
          seeds = all_tables - impacted
          print('Models actually built into the staging schema (this is the impacted-model list, verified against the real database):')
          for name in sorted(all_tables & impacted):
              print(f'  - {name}')
          missing = impacted - all_tables
          if missing:
              print('WARNING -- zhao flagged these as impacted but they are NOT in the staging schema:')
              for name in sorted(missing):
                  print(f'  - {name}')
          print('Seed / prerequisite source data also present (not an impacted model):')
          for name in sorted(seeds):
              print(f'  - {name}')
          "

      # For contrast: dbt's own state:modified+ selector doesn't know column-level
      # lineage -- it selects every file that changed plus its entire downstream
      # cone, whether or not anything in that cone actually reads what changed.
      # This step computes a real baseline manifest (the same merge-base zhao
      # resolved above) and prints what state:modified+ would have built, so the
      # difference against the list above is a real, in-CI number, not a claim.
      - name: Set up a baseline manifest for the state:modified+ comparison
        run: |
          git fetch origin "${{ github.base_ref }}"
          git worktree add /tmp/zhao-baseline "origin/${{ github.base_ref }}"
          cd /tmp/zhao-baseline/dbt_projects/breaking-change-gate
          DBT_PROFILES_DIR=. dbt seed
          DBT_PROFILES_DIR=. dbt compile

      - name: For comparison -- what dbt's own state:modified+ selector would build
        run: |
          echo "dbt ls --select state:modified+ --state <baseline manifest>"
          # --quiet suppresses dbt's own log lines (Running with dbt=..., Found N
          # models..., etc.) on stdout -- without it, the WARNING/INFO preamble
          # gets captured into the file below right alongside the actual selected
          # node names, silently inflating the count the next step computes from it.
          dbt --quiet ls --resource-type model --select "state:modified+" \
            --state /tmp/zhao-baseline/dbt_projects/breaking-change-gate/target \
            | tee /tmp/state_modified_plus.txt
        env:
          DBT_PROFILES_DIR: .

      # The two steps above produce two lists; this step is the actual point
      # of running them side by side -- turning "here are two lists, go count
      # them" into an explicit, computed savings number in the log itself.
      # Only meaningful once a real build happened, so it's gated the same
      # way as the build steps above: if zhao_check failed, nothing was built
      # at all and there's no "models actually built" number to report.
      - name: "Savings: models zhao actually rebuilt vs. state:modified+'s fan-out"
        if: steps.zhao_check.outcome == 'success'
        run: |
          zhao_count=$(wc -l < /tmp/impacted_models.txt | tr -d ' ')
          fanout_count=$(wc -l < /tmp/state_modified_plus.txt | tr -d ' ')
          # NOTE: paste -d takes its argument as a list of single-character
          # delimiters to cycle through per line, not a literal string --
          # `-d ', '` alternates ',' then ' ' rather than joining with ", "
          # every time, which only shows up once a list has 3+ items. Join
          # with a plain comma and expand it after, instead.
          echo "zhao built (actually-impacted):   $zhao_count model(s) -> $(paste -sd , /tmp/impacted_models.txt | sed 's/,/, /g')"
          echo "state:modified+ would have built: $fanout_count model(s) -> $(paste -sd , /tmp/state_modified_plus.txt | sed 's/,/, /g')"
          if [ "$fanout_count" -gt "$zhao_count" ]; then
            saved=$((fanout_count - zhao_count))
            pct=$((saved * 100 / fanout_count))
            echo ""
            echo "==> This run built $saved fewer model(s) than state:modified+ would have ($pct% less rebuilt) -- less warehouse compute and less time waiting on this PR, for the exact same change."
          elif [ "$fanout_count" -eq "$zhao_count" ]; then
            echo ""
            echo "==> Same set this time -- state:modified+'s fan-out only exceeds zhao's list when a downstream model doesn't actually read what changed. See the cascading-window-backfill/downstream-cascaded-run examples for the same idea applied to microbatch time windows instead of model selection."
          fi
